<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
   <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
   <title>Sofi's Books - Order</title>
   <style>
      body {
         font-family: Arial, sans-serif;
         background: #f5f5f5;
         padding: 20px;
      }
      .menu-item {
         display: flex;
         align-items: center;
         margin-bottom: 10px;
         padding: 10px;
         border: 1px solid #ddd;
         border-radius: 8px;
         background: #fff;
      }
      .menu-item input {
         margin-right: 10px;
      }
      button {
         background-color: #007bff;
         color: white;
         padding: 10px;
         width: 100%;
         border: none;
         border-radius: 6px;
         cursor: pointer;
         font-weight: bold;
      }
      button:hover {
         background-color: #0056b3;
      }
         body{
			background-image: url(https://masterbundles.com/wp-content/uploads/2023/02/wave-background-23-992.jpg);    
			background-repeat: no-repeat;
			background-size: cover;
			background-attachment: fixed;
			font-family: monospace;
         }
   </style>
</head>
<body>

   <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 rounded">
      <div class="container-fluid">
         <a class="navbar-brand" href="index.html">ꜱᴏꜰɪ'ꜱ ʙᴏᴏᴋꜱ</a>
         <div>
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
               <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
               <li class="nav-item"><a class="nav-link" href="page2.html">Books</a></li>
               <li class="nav-item"><a class="nav-link" href="page3.html">Contact Us</a></li>
            </ul>
         </div>
      </div>
   </nav>

   <h2 class="text-center mb-4">Order Books Now!</h2>

   <div class="container">
      <div class="row">
         
         <div class="col-md-6">
            <div class="card p-3">
               <h4>Dystopian</h4>
               <div class="menu-item"><input type="checkbox" id="animal_farm"> Animal Farm - ₱200</div>
               <div class="menu-item"><input type="checkbox" id="noli_me_tangere"> Noli Me Tangere - ₱300</div>
               <div class="menu-item"><input type="checkbox" id="dekada70"> Dekada 70 - ₱400</div>
            </div>
         </div>
         <br><br>
         <div class="col-md-6">
            <div class="card p-3">
               <h4>Academics</h4>
              <div class="menu-item"><input type="checkbox" id="math"> Mathematics - ₱200</div>
              <div class="menu-item"><input type="checkbox" id="sci"> Science - ₱300</div>
              <div class="menu-item"><input type="checkbox" id="eng"> English - ₱400</div>
            </div>
         </div>
         <br><br>
         <div class="col-md-6">
            <div class="card p-3">
               <h4>Young Adult</h4>
               <div class="menu-item"><input type="checkbox" id="twilight"> Twilight - ₱200</div>
               <div class="menu-item"><input type="checkbox" id="cityof_bones"> City of Bones - ₱300</div>
                <div class="menu-item"><input type="checkbox" id="the_giver"> The Giver - ₱400</div>
            </div>
         </div>
         <div class="col-md-6">
            <div class="card p-3">
               <h4>Customer Details</h4>
               <input type="text" id="name" placeholder="Name" class="form-control mb-2">
               <input type="text" id="address" placeholder="Address" class="form-control mb-2">
               <input type="text" id="contact" placeholder="Contact Number" class="form-control mb-2">
               <button type="button" py-click="create_order">Create Order</button>

            </div>
         </div>
      </div>
      <div class="card p-3 mt-4">
         <h4>Order Summary</h4>
         <div id="output"></div>
      </div>
   </div>

   <py-script src="main.py"></py-script>
</body>
</html>
